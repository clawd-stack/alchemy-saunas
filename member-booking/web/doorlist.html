<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Door list, Alchemy East Fremantle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap wrap--wide">
    <h1>Door list</h1>
    <div id="messages"></div>

    <section class="card card--pad" id="signin-card">
      <form id="signin-form" class="stack">
        <div>
          <label for="email">Staff email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="signin-button">Sign in</button>
      </form>
    </section>

    <section id="door-section" class="hidden">
      <div class="card">
        <div class="row row--between">
          <div style="flex:1;min-width:150px">
            <label for="date">Date</label>
            <input id="date" type="date">
          </div>
          <div style="flex:2;min-width:200px">
            <label for="session">Session</label>
            <select id="session"></select>
          </div>
        </div>
        <div class="row row--tight" style="margin-top:14px">
          <button class="btn-quiet btn-small" id="refresh" type="button">Refresh</button>
          <a class="btn-quiet btn-small" id="csv" href="#" style="text-decoration:none">CSV</a>
        </div>
      </div>

      <div id="stale"></div>
      <div id="totals" class="card hidden"></div>
      <div id="list"></div>
    </section>
  </main>
  <script type="module" src="/doorlist.js"></script>
</body>
</html>
