<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Book, Alchemy East Fremantle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <h1 id="heading">Book a session</h1>
    <div id="messages"></div>
    <p class="spinner" id="page-loading">Loading…</p>

    <section class="card card--pad hidden" id="signin-card">
      <form id="signin-form" class="stack">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="signin-button">Sign in</button>
      </form>

      <p class="hint" style="margin:18px 0 0">
        First time here?
        <button class="link-button" type="button" id="first-time">Set your password</button>
      </p>

      <form id="claim-form" class="stack" hidden>
        <h3 style="margin:0">Set your password</h3>
        <p class="hint" style="margin:0">
          Use the email address Alchemy has for your membership. You choose the password,
          and it is the one you will sign in with from now on.
        </p>
        <div>
          <label for="claim-email">Email</label>
          <input id="claim-email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="claim-password">New password (at least 12 characters)</label>
          <input id="claim-password" type="password" autocomplete="new-password" minlength="12" required>
        </div>
        <div>
          <label for="claim-confirm">New password again</label>
          <input id="claim-confirm" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn-primary" type="submit" id="claim-button">Set password and sign in</button>
        <button class="btn-quiet btn-small btn-inline" type="button" id="claim-cancel">Back to signing in</button>
      </form>
    </section>

    <p class="support" id="support" hidden></p>

    <section id="booking-section" class="hidden">
      <p class="month" id="month"></p>
      <div class="days" id="days"></div>
      <p class="day-heading" id="day-heading" hidden></p>
      <div class="sessions" id="slots"></div>
      <p class="spinner" id="slots-empty" hidden>No sessions this day.</p>

      <div class="card card--pad hidden" id="guest-card">
        <h3 id="selected-label"></h3>
        <p class="muted selected-detail" id="selected-detail" hidden></p>
        <div class="stack" id="guest-fields"></div>
        <div class="row row--tight" style="margin-top:20px">
          <button class="btn-quiet btn-small" id="add-guest" type="button">Add guest</button>
          <span class="hint" id="guest-count" style="margin:0"></span>
        </div>
        <div class="total" style="margin:30px 0 20px">
          <span class="muted">Due at the door</span>
          <span class="amount" id="amount">$0.00</span>
        </div>
        <button class="btn-primary" id="confirm" type="button">Confirm</button>
      </div>

      <h2>Your bookings</h2>
      <div id="my-bookings"></div>
    </section>
  </main>

  <script type="module" src="/booking.js"></script>
</body>
</html>
