<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Book, Alchemy East Fremantle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <h1 id="heading">Book a session</h1>
    <div id="messages"></div>

    <section class="card card--pad" id="signin-card">
      <form id="signin-form" class="stack">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="signin-button">Sign in</button>
      </form>
    </section>

    <section id="booking-section" class="hidden">
      <p class="month" id="month"></p>
      <div class="days" id="days"></div>
      <div class="slots" id="slots"></div>
      <p class="spinner" id="slots-empty" hidden>No sessions this day.</p>

      <div class="card card--pad hidden" id="guest-card">
        <h3 id="selected-label"></h3>
        <div class="stack" id="guest-fields"></div>
        <div class="row row--tight" style="margin-top:14px">
          <button class="btn-quiet btn-small" id="add-guest" type="button">Add guest</button>
          <span class="hint" id="guest-count" style="margin:0"></span>
        </div>
        <div class="total" style="margin:24px 0 16px">
          <span class="muted">Due at the door</span>
          <span class="amount" id="amount">$0.00</span>
        </div>
        <button class="btn-primary" id="confirm" type="button">Confirm</button>
      </div>

      <h2>Your bookings</h2>
      <div id="my-bookings"></div>
    </section>
  </main>

  <script type="module" src="/booking.js"></script>
</body>
</html>
