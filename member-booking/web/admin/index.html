<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin, Alchemy East Fremantle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <h1>Admin</h1>
    <div id="messages"></div>
    <p class="spinner" id="page-loading">Loading…</p>

    <section class="card card--pad hidden" id="signin-card">
      <form id="signin-form" class="stack">
        <div>
          <label for="email">Staff email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="signin-button">Sign in</button>
      </form>
    </section>

    <div id="page-body" class="hidden">
      <div id="warnings"></div>
      <div id="hub"></div>
    </div>
  </main>
  <script type="module" src="/admin/hub.js"></script>
</body>
</html>
