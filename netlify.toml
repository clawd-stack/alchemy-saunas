# Alchemy East Fremantle member booking channel.
# The Webflow site stays the public presentation layer; this project owns the API
# and the three internal pages (booking embed, door list, admin config).

# This file lives at the REPOSITORY ROOT deliberately.
#
# Netlify reads netlify.toml from the repo root. When it sat inside
# member-booking/ the first deploy never found it: no build ran, no functions
# were bundled, no database was provisioned, and the repository root was
# published as static files. Keeping it here, with `base` pointing at the
# subdirectory, is Netlify's documented monorepo layout and does not depend on
# any setting being typed correctly in the UI.
#
# publish, functions and the build command below are all relative to `base`.

[build]
  base = "member-booking"
  publish = "web"
  functions = "netlify/functions"
  # Typecheck only. The test suite runs in GitHub Actions against a throwaway
  # Postgres; running it here risks pointing the integration tests at the
  # database Netlify has provisioned for this site.
  command = "npm run typecheck"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Scheduled functions declare their own cadence via `export const config`
# in netlify/functions/cron-*.ts, so no plugin is needed here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The booking embed is loaded inside the Webflow page, so it must be framable
# by the Alchemy site specifically (not by anyone).
[[headers]]
  for = "/booking.html"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "frame-ancestors 'self' https://*.webflow.io https://alchemysaunas.com.au https://*.alchemysaunas.com.au"

[dev]
  framework = "#static"
  publish = "web"
